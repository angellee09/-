let currentUser=null, currentApplicant=null, tab='實務教學', adminTab='dashboard', staffFilling=false;
const ADMIN_PASSWORD='MKC116ADMIN'; // 測試用管理者密碼
const items=['實務教學','國內研習','國際研討會','教師進修','升等送審','證照獎勵'];
const itemLabels={'實務教學':'推動實務教學（競賽獲獎）','國內研習':'教師參加國內研習','國際研討會':'教師發表並參加國際研討會','教師進修':'教師進修','升等送審':'教師升等送審','證照獎勵':'教師取得證照獎勵'};
function itemLabel(item){return itemLabels[item]||item;}
const prize={
'國際競賽 A 級':{'第一名':50000,'第二名':40000,'第三名':30000,'第四名':20000,'第五名':20000,'第六名':20000},
'國際競賽 B 級':{'第一名':25000,'第二名':20000,'第三名':15000,'第四名':10000,'第五名':10000,'第六名':10000},
'中央行政機關主辦之競賽':{'第一名':25000,'第二名':20000,'第三名':15000,'第四名':10000,'第五名':10000,'第六名':10000},
'全國競賽 A 級':{'第一名':10000,'第二名':9000,'第三名':8000},
'全國競賽 B 級':{'第一名':6000,'第二名':5000,'第三名':3000},
'區域性競賽':{'第一名':3000,'第二名':2000,'第三名':1000}
};
const categories=Object.keys(prize), ranks=['第一名','第二名','第三名','第四名','第五名','第六名'];
const cert={ '國家高等考試專門技術人員':10000,'國家普通考試專門技術人員':5000,'中華民國技術士甲級':10000,'中華民國技術士乙級':5000 };
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return Number(n||0).toLocaleString('zh-TW')}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function teacherById(id){return TEACHERS.find(x=>String(x['編號'])===String(id))}
function teacherClass(t){if(!t)return''; const role=String(t['身分別']||'').trim(), title=String(t['教師職稱']||'').trim(); if(role==='行政' || !title)return '承辦人員'; if(['教授','副教授','助理教授','講師'].includes(title))return '一般教師'; if(title.includes('級專業技術教師'))return '專技教師'; if(title==='實習指導教師')return '實習指導教師'; return '教師'}
function isAdmin(t){return teacherClass(t)==='承辦人員'}
function nextRank(title){return ({'講師':'助理教授','助理教授':'副教授','副教授':'教授','講師級專業技術教師':'助理教授級專業技術教師','助理教授級專業技術教師':'副教授級專業技術教師','副教授級專業技術教師':'教授級專業技術教師'})[title]||''}
function currentTotal(applicant,item,exceptId=''){return state.records.filter(r=>r.applicantId===applicant&&r.item===item&&r.id!==exceptId).reduce((a,r)=>a+Number(r.amount||0),0)}
function ownVisible(r){if(!currentUser)return false; if(isAdmin(currentUser)){const u=currentUser['單位']; const t=teacherById(r.applicantId); return t&&t['單位']===u} return r.fillerId===currentUser['編號'] || r.applicantId===currentUser['編號']}
function eligibleApplicants(){if(!currentUser)return[]; const unit=currentUser['單位']; if(isAdmin(currentUser)) return TEACHERS.filter(t=>teacherClass(t)!=='承辦人員' && t['單位']===unit); const ids=new Set([currentUser['編號']]); Object.entries(state.delegations).forEach(([f,arr])=>{if(f===currentUser['編號'])arr.forEach(id=>{const t=teacherById(id); if(t&&t['單位']===unit)ids.add(id)})}); return TEACHERS.filter(t=>ids.has(t['編號'])&&t['單位']===unit)}
function isSystemAdmin(){return !!currentUser&&currentUser.__admin===true}
function adminLogin(){const pw=prompt('請輸入管理者後台密碼：');if(pw===null)return;if(pw!==ADMIN_PASSWORD)return alert('管理者密碼錯誤，無法進入後台。');currentUser={__admin:true,'編號':'ADMIN','姓  名':'系統管理者','單位':'全校','身分別':'管理者','教師職稱':''};currentApplicant=null;adminTab='dashboard';staffFilling=false;render()}
function adminAllRows(){return state.records.slice()}
function adminView(){return `<div class="admin-tabs">${[['dashboard','全校總覽'],['detail','需求明細'],['progress','單位完成進度'],['settings','調查設定'],['data','資料管理']].map(x=>`<button class="admin-tab ${adminTab===x[0]?'active':''}" onclick="adminTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${adminTab==='dashboard'?adminDashboard():adminTab==='detail'?adminDetail():adminTab==='progress'?unitProgress():adminTab==='settings'?adminSettings():adminData()}`}
function adminDashboard(){const rows=adminAllRows(), units=[...new Set(TEACHERS.filter(t=>teacherClass(t)!=='承辦人員').map(t=>t['單位']))], people=new Set(rows.map(r=>r.applicantId));const amount=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card"><div class="section-title"><div><h2>全校總覽</h2><div class="muted">調查年度 ${state.year} 年度｜資料以目前瀏覽器儲存資料為準</div></div><button class="btn secondary" onclick="exportAllCSV()">匯出全校 CSV</button></div><div class="admin-kpi" style="margin-top:14px"><div class="stat"><div class="mini">資料筆數</div><div class="n">${rows.length}</div></div><div class="stat"><div class="mini">已有申請教師</div><div class="n">${people.size}</div></div><div class="stat"><div class="mini">申請經費合計</div><div class="n">${money(amount)}</div></div><div class="stat"><div class="mini">單位數</div><div class="n">${units.length}</div></div></div></div>${adminSummaryTable(rows)}${adminSchoolwideSummary(rows)}`}
function adminSummaryTable(rows){const agg={};rows.forEach(r=>{const t=teacherById(r.applicantId);const k=`${t?.['單位']||''}|${r.item}`;if(!agg[k])agg[k]={unit:t?.['單位']||'',item:r.item,cases:0,amount:0};agg[k].cases++;agg[k].amount+=Number(r.amount||0)});if(!Object.keys(agg).length)return '<div class="card empty">目前尚無申請資料。</div>';return `<div class="card"><div class="section-title"><h2>各項目各科統計</h2><div class="muted">各申請項目依單位分別統計</div></div><div class="table-wrap"><table><thead><tr><th>單位</th><th>項目名稱</th><th>申請案次</th><th>申請經費小計</th></tr></thead><tbody>${Object.values(agg).map(x=>`<tr><td>${esc(x.unit)}</td><td>${esc(itemLabel(x.item))}</td><td class="num">${x.cases}</td><td class="num">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div></div>`}
function adminSchoolwideSummary(rows){const agg={};rows.forEach(r=>{if(!agg[r.item])agg[r.item]={item:r.item,cases:0,amount:0};agg[r.item].cases++;agg[r.item].amount+=Number(r.amount||0)});return `<div class="card"><div class="section-title"><div><h2>各項目全校統計</h2><div class="muted">依個別申請項目統計全校合計，不區分單位。</div></div></div><div class="table-wrap"><table><thead><tr><th>項目名稱</th><th>全校合計案次</th><th>全校合計經費</th></tr></thead><tbody>${items.map(item=>{const x=agg[item]||{cases:0,amount:0};return `<tr><td>${esc(itemLabel(item))}</td><td class="num">${x.cases}</td><td class="num">${money(x.amount)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function adminDetail(){const rows=adminAllRows();return `<div class="card"><div class="section-title"><div><h2>需求明細</h2><div class="muted">可依六項申請類別查看全校填報資料。</div></div><button class="btn secondary" onclick="exportAllCSV()">匯出 CSV</button></div><div class="tabs" style="margin-top:14px">${items.map((x,i)=>`<button class="tab ${tab===x?'active':''}" onclick="tab='${x}';render()">${i+1}. ${itemLabel(x)}</button>`).join('')}</div>${adminRowsTable(rows.filter(r=>r.item===tab))}</div>`}
function adminRowsTable(rows){if(!rows.length)return '<div class="empty">此項目目前尚無資料。</div>';return `<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>填表人</th><th>申請人</th><th>單位</th><th>項目</th><th>申請內容</th><th>金額</th><th>備註</th></tr></thead><tbody>${rows.map(r=>{const f=teacherById(r.fillerId),a=teacherById(r.applicantId);return `<tr><td>${esc(f?.['姓  名']||'')}</td><td>${esc(a?.['姓  名']||'')}</td><td>${esc(a?.['單位']||'')}</td><td>${esc(itemLabel(r.item))}</td><td>${esc(r.caseName||r.category||r.degree||r.place||r.rank||'')}</td><td class="num">${money(r.amount||0)}</td><td>${esc(r.note||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function unitProgress(){const units=[...new Set(TEACHERS.filter(t=>teacherClass(t)!=='承辦人員').map(t=>t['單位']))];return `<div class="card"><h2>單位完成進度</h2><div class="muted">以有至少一筆申請資料的教師人數作為目前完成數；若要改成「正式送出」制，後續可再加入提交狀態。</div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>單位</th><th>教師人數</th><th>已有資料人數</th><th>完成率</th></tr></thead><tbody>${units.map(u=>{const all=TEACHERS.filter(t=>teacherClass(t)!=='承辦人員'&&t['單位']===u),done=new Set(state.records.filter(r=>teacherById(r.applicantId)?.['單位']===u).map(r=>r.applicantId)).size,p=all.length?Math.round(done/all.length*100):0;return `<tr><td>${esc(u)}</td><td>${all.length}</td><td>${done}</td><td><div class="progress"><span style="width:${p}%"></span></div><div class="mini">${p}%</div></td></tr>`}).join('')}</tbody></table></div></div>`}
function nowLocal(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function surveyOpen(){if(!state.open)return false;const now=Date.now();const start=state.openStart?new Date(state.openStart).getTime():0;const end=state.openEnd?new Date(state.openEnd).getTime():Infinity;return now>=start&&now<=end}
function surveyPeriodText(){if(!state.open)return '目前未開放填寫';const s=state.openStart?state.openStart.replace('T',' '):'未設定';const e=state.openEnd?state.openEnd.replace('T',' '):'未設定';return `開放期間：${s} ～ ${e}`}
function fillGuard(){if(surveyOpen())return true;alert(`目前不在調查開放期間，無法新增或修改申請資料。\n${surveyPeriodText()}`);return false}
function adminSettings(){return `<div class="card"><h2>調查期間設定</h2><div class="notice" style="margin:12px 0">使用者只有在下列開放期間內，才能新增申請資料；期間外仍可登入及查詢既有資料。</div><div class="grid"><div class="field"><label>調查年度</label><input id="setYear" type="number" value="${state.year}"></div><div class="field"><label>調查狀態</label><select id="setOpen"><option value="true" ${state.open?'selected':''}>開放</option><option value="false" ${!state.open?'selected':''}>關閉</option></select></div><div class="field"><label>開放起始時間</label><input id="setStart" type="datetime-local" value="${state.openStart||''}"></div><div class="field"><label>開放截止時間</label><input id="setEnd" type="datetime-local" value="${state.openEnd||''}"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveSettings()">儲存設定</button></div><div class="muted" style="margin-top:10px">${esc(surveyPeriodText())}</div></div>`}
function saveSettings(){const st=document.getElementById('setStart').value,en=document.getElementById('setEnd').value;if(st&&en&&new Date(st).getTime()>new Date(en).getTime())return alert('開放起始時間不可晚於截止時間。');state.year=Number(document.getElementById('setYear').value||116);state.open=document.getElementById('setOpen').value==='true';state.openStart=st;state.openEnd=en;save();render()}
function adminData(){return `<div class="card"><div class="section-title"><div><h2>資料管理</h2><div class="muted">可匯出全校資料，或清除本瀏覽器的測試資料。</div></div><button class="btn secondary" onclick="exportAllCSV()">匯出全校 CSV</button></div><div class="actions" style="margin-top:16px"><button class="btn danger" onclick="resetDemo()">清除全部申請資料</button></div></div>`}
function resetDemo(){if(!confirm('確定清除目前瀏覽器內全部申請資料？'))return;state.records=[];save();render()}
function exportAllCSV(){const rows=adminAllRows();if(!rows.length)return alert('目前沒有可匯出的資料。');const data=[['填表人','申請人','單位','項目','申請案次/類別','金額','備註'],...rows.map(r=>{const f=teacherById(r.fillerId),a=teacherById(r.applicantId);return [f?.['姓  名']||'',a?.['姓  名']||'',a?.['單位']||'',r.item,r.caseName||r.category||r.degree||r.place||r.rank||'',r.amount||0,r.note||'']})];const csv='\ufeff'+data.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`獎補助調查資料_全校_${state.year}.csv`;a.click();URL.revokeObjectURL(a.href)}
function login(){const id=document.getElementById('loginId').value.trim(); const t=TEACHERS.find(x=>String(x['編號']).toLowerCase()===id.toLowerCase()||String(x['姓  名']).trim()===id); if(!t)return alert('找不到名單中的人員，請輸入正確的編號或姓名。'); currentUser=t; currentApplicant=eligibleApplicants()[0]?.['編號']||t['編號']; render()}
function logout(){currentUser=null;currentApplicant=null;staffFilling=false;render()}
function startStaffFill(){const id=document.getElementById('staffApplicant')?.value;if(!id)return alert('請先選擇要代填的教師。');currentApplicant=id;staffFilling=true;tab='實務教學';render()}
function backToStaff(){staffFilling=false;render()}
function render(){document.getElementById('app').innerHTML=currentUser?mainView():loginView()}
function loginView(){return `<div class="login"><div class="top"><div><h1>教師獎補助調查表</h1><small>第二版完整表單｜教師、單位承辦人及管理者</small></div></div><div class="card"><h2>使用者辨識</h2><div class="notice">本版以名單作為辨識來源。教師可填寫自己或經設定可代填權限之同單位教師；單位承辦人可查詢及代填所屬單位教師；管理者可進入全校資料管理後台。</div><div class="field" style="margin-top:14px"><label>請輸入員工編號或姓名</label><input id="loginId" placeholder="例如：a123 或 王大明" onkeydown="if(event.key==='Enter')login()"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="login()">進入系統</button><button class="btn secondary" onclick="adminLogin()">管理者後台</button></div><p class="muted">目前名單：${TEACHERS.length} 人。${surveyPeriodText()}。管理者後台需輸入管理者密碼；單位承辦人登入後，可直接選擇本單位教師開始代填。</p></div></div>`}
function mainView(){return `<div class="top"><div><h1>教師獎補助調查表</h1><small>調查年度：${state.year} 年度　｜　目前使用者：${esc(currentUser['姓  名']||'管理者')}（${esc(currentUser['編號']||'ADMIN')}）</small></div><div class="actions"><span class="badge" style="background:#fff;color:#123b67">${isSystemAdmin()?'管理者':isAdmin(currentUser)?'單位承辦人':'教師'}</span><button class="btn" onclick="logout()">登出</button></div></div>${isSystemAdmin()?adminView():isAdmin(currentUser)?(staffFilling?teacherView():staffView()):teacherView()}`}
function personBox(){const list=eligibleApplicants(); const t=teacherById(currentApplicant); return `<div class="card"><div class="section-title"><div><h2>教師填寫區</h2><div class="muted">選擇申請人後，單位、職稱及教師類別由系統直接顯示；只有「申請人」可選擇。</div></div></div><div class="grid" style="margin-top:14px"><div class="field"><label>申請人</label><select id="applicant" onchange="currentApplicant=this.value;tab='實務教學';render()">${list.map(t=>`<option value="${esc(t['編號'])}" ${String(t['編號'])===String(currentApplicant)?'selected':''}>${esc(t['姓  名'])}｜${esc(t['編號'])}</option>`).join('')}</select></div><div class="field"><label>單位</label><div class="display-box">${esc(t?.['單位']||'')}</div></div><div class="field"><label>職稱</label><div class="display-box">${esc(t?.['教師職稱']||'行政')}</div></div><div class="field"><label>教師類別</label><div class="display-box">${esc(teacherClass(t))}</div></div></div></div>`}
function teacherView(){return `<div class="card"><div class="notice survey-period-notice"><b>${esc(surveyOpen()?'目前為開放填寫期間':'目前不在開放填寫期間')}</b>｜${esc(surveyPeriodText())}${surveyOpen()?'':'。目前仍可查詢既有資料。'}</div></div>`+(isAdmin(currentUser)&&staffFilling?`<div class="card"><div class="actions"><button class="btn secondary" onclick="backToStaff()">← 返回承辦人查詢區</button></div><div class="notice" style="margin-top:10px">目前為承辦人代填模式：以下資料將以「${esc(currentUser['姓  名'])}」為填表人，並儲存至所選教師的申請資料。</div></div>`:'')+personBox()+tabs()+itemForm()+summaryBox()}
function tabs(){return `<div class="tabs" aria-label="申請項目">${items.map((x,i)=>`<button class="tab ${tab===x?'active':''}" onclick="tab='${x}';render()">${i+1}. ${itemLabel(x)}</button>`).join('')}</div>`}
function itemForm(){const t=teacherById(currentApplicant); if(!t)return ''; if(tab==='實務教學')return practiceForm(t); if(tab==='國內研習')return domesticForm(t); if(tab==='國際研討會')return intlForm(t); if(tab==='教師進修')return studyForm(t); if(tab==='升等送審')return promotionForm(t); return certForm(t)}
function addRecord(obj){if(!fillGuard())return;state.records.push({id:Date.now()+Math.random(),fillerId:currentUser['編號'],applicantId:currentApplicant,item:tab,...obj});save();render()}
function del(id){if(!fillGuard())return;state.records=state.records.filter(r=>r.id!==id);save();render()}
function practiceForm(t){const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='實務教學');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card item-card"><div class="item-head"><h2>1. 推動實務教學（競賽獲獎）</h2><div class="muted">請選擇競賽類別及預計獲獎名次，獎勵金由系統依規定自動計算。</div></div><div class="grid"><div class="field"><label>競賽類別</label><select id="pCat">${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>預計獲獎名次</label><select id="pRank">${ranks.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>備註</label><input id="pNote" placeholder="可填競賽名稱等"></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addPractice()">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元</div></div>${rowsTable(rows,['競賽類別','預計獲獎名次','獎勵金','備註'])}</div>`}
function addPractice(){const c=pCat.value,r=pRank.value,a=prize[c][r]||0; if(currentTotal(currentApplicant,'實務教學')+a>50000)return alert('超過個人 50,000 元上限。'); addRecord({category:c,rank:r,amount:a,note:pNote.value})}
function domesticForm(t){const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='國內研習');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card item-card"><div class="item-head"><h2>2. 教師參加國內研習</h2><div class="muted">個人年度合計上限 30,000 元。</div></div><div class="grid"><div class="field"><label>擬申請案次</label><input id="dCase" placeholder="請輸入案次，如1、2、3…"></div><div class="field"><label>擬申請年度經費</label><input id="dAmt" type="number" min="0" step="1"></div><div class="field"><label>備註</label><input id="dNote" placeholder="可填寫活動名稱等"></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addDomestic()">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元／30,000 元</div></div>${rowsTable(rows,['擬申請案次','擬申請年度經費','備註'])}</div>`}
function addDomestic(){const a=Number(dAmt.value||0);if(!dCase.value.trim())return alert('請輸入擬申請案次。');if(currentTotal(currentApplicant,'國內研習')+a>30000)return alert('超過個人 30,000 元上限。');addRecord({caseName:dCase.value,amount:a,note:dNote.value})}
function intlForm(t){const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='國際研討會');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card item-card"><div class="item-head"><h2>3. 教師發表並參加國際研討會</h2><div class="muted">國內：依差旅費申請辦法；國外：機票補助上限50000；大陸港澳：機票補助上限30,000；報名（註冊）費實報實銷。</div></div><div class="grid"><div class="field"><label>國際研討會地點</label><select id="iPlace"><option>國內</option><option>國外</option><option>大陸港澳</option></select></div><div class="field"><label>擬申請補助差旅費或機票</label><input id="iAir" type="number" min="0"></div><div class="field"><label>擬申請補助報名（註冊）費</label><input id="iFee" type="number" min="0"></div><div class="field"><label>備註</label><input id="iNote"></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addIntl()">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元</div></div>${rowsTable(rows,['國際研討會地點','國外機票','報名（註冊）費','備註'])}</div>`}
function addIntl(){if(!fillGuard())return;const place=iPlace.value,air=Number(iAir.value||0),fee=Number(iFee.value||0);const limit=place==='國外'?50000:place==='大陸港澳'?30000:Infinity;const old=state.records.filter(r=>r.applicantId===currentApplicant&&r.item==='國際研討會'&&r.place===place).reduce((a,r)=>a+Number(r.air||0),0);if(old+air>limit)return alert(`超過${place}機票補助上限。`);addRecord({place,air,fee,amount:air+fee,note:iNote.value})}
function studyForm(t){const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='教師進修');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card item-card"><div class="item-head"><h2>4. 教師進修</h2><div class="muted">博士每學期最高 60,000 元；碩士每學期最高 35,000 元。</div></div><div class="five-grid"><div class="field"><label>進修學位</label><select id="sDegree"><option>博士</option><option>碩士</option></select></div><div class="field"><label>進修學校</label><input id="sSchool"></div><div class="field"><label>補助金額</label><input id="sAmt" type="number" min="0"></div><div class="field"><label>補助學期</label><select id="sTerm"><option>${state.year} 學年度上學期</option><option>${state.year-1} 學年度下學期</option></select></div><div class="field"><label>校教評會是否已通過</label><select id="sPass"><option>是</option><option>否</option></select></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addStudy()">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元</div></div>${rowsTable(rows,['進修學位','進修學校','補助金額','補助學期','校教評會是否已通過'])}</div>`}
function addStudy(){const limit=sDegree.value==='博士'?60000:35000,a=Number(sAmt.value||0);if(a>limit)return alert(`超過${sDegree.value}每學期 ${money(limit)} 元上限。`);const exists=state.records.some(r=>r.applicantId===currentApplicant&&r.item==='教師進修'&&r.term===sTerm.value);if(exists)return alert(`「${sTerm.value}」已新增資料，不能重複新增相同補助學期。`);addRecord({degree:sDegree.value,school:sSchool.value,amount:a,term:sTerm.value,pass:sPass.value})}
function promotionForm(t){const title=t['教師職稱']||'';const tc=teacherClass(t), rank=nextRank(title);let fee='';if(tc==='專技教師')fee=10000;else if(tc==='一般教師')fee=rank==='助理教授'?15000:rank==='副教授'||rank==='教授'?9000:'';const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='升等送審');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);const months=[`${state.year}年2月`,`${state.year}年8月`];return `<div class="card item-card"><div class="item-head"><h2>5. 教師升等送審</h2><div class="muted">教師類別及送審職級由系統依名單自動判定，審查費用不需填寫。</div></div><div class="six-grid"><div class="field"><label>教師類別</label><div class="display-box">${esc(tc)}</div></div><div class="field"><label>目前教師職級</label><div class="display-box">${esc(title)}</div></div><div class="field"><label>送審職級</label><div class="display-box">${esc(rank)}</div></div><div class="field"><label>送審類別</label><select id="prCat"><option>學位</option><option>專門著作</option><option>技術報告</option><option>教學實務</option><option>其他(請於備註欄說明)</option></select></div><div class="field"><label>預計送審年月</label><select id="prMonth">${months.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label>備註</label><input id="prNote"></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addPromotion(${fee===''?0:fee})">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元</div></div>${rowsTable(rows,['教師類別','送審職級','送審類別','預計送審年月','審查費用','備註'])}</div>`}
function addPromotion(fee){if(!fillGuard())return;if(!fee)return alert('目前規格未提供此教師類別／職級組合的明確費用，第一版不自行推定。');const exists=state.records.some(r=>r.applicantId===currentApplicant&&r.item==='升等送審'&&r.expectedMonth===prMonth.value);if(exists)return alert(`「${prMonth.value}」已新增資料，不能重複新增相同預計送審年月。`);const t=teacherById(currentApplicant);addRecord({teacherClass:teacherClass(t),rank:nextRank(t['教師職稱']||''),category:prCat.value,expectedMonth:prMonth.value,amount:fee,note:prNote.value})}
function certForm(t){const rows=state.records.filter(r=>r.applicantId===t['編號']&&r.item==='證照獎勵');const total=rows.reduce((a,r)=>a+Number(r.amount||0),0);return `<div class="card item-card"><div class="item-head"><h2>6. 教師取得證照獎勵</h2><div class="muted">請選擇證照類別並填寫證照名稱，獎勵金由系統自動判定。</div></div><div class="grid"><div class="field"><label>證照類別</label><select id="cCat">${Object.keys(cert).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>證照名稱</label><input id="cName"></div><div class="field"><label>備註</label><input id="cNote"></div></div><div class="actions" style="margin-top:12px;align-items:center"><button class="btn primary" onclick="addCert()">新增一筆</button><div class="amount-box">目前已累計申請金額：${money(total)} 元</div></div>${rowsTable(rows,['證照類別','證照名稱','獎勵金額','備註'])}</div>`}
function addCert(){addRecord({category:cCat.value,certName:cName.value,amount:cert[cCat.value],note:cNote.value})}
function rowsTable(rows,cols){if(!rows.length)return '<div class="empty">尚未新增資料。</div>';return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(display(r,c))}</td>`).join('')}<td><button class="btn danger small" onclick="del(${r.id})">刪除</button></td></tr>`).join('')}</tbody></table></div>`}
function display(r,c){return ({'競賽類別':r.category,'預計獲獎名次':r.rank,'獎勵金':money(r.amount),'擬申請案次':r.caseName,'擬申請年度經費':money(r.amount),'國際研討會地點':r.place,'國外機票':money(r.air),'報名（註冊）費':money(r.fee),'進修學位':r.degree,'進修學校':r.school,'補助金額':money(r.amount),'補助學期':r.term,'校教評會是否已通過':r.pass,'教師類別':r.teacherClass,'送審職級':r.rank,'送審類別':r.category,'預計送審年月':r.expectedMonth,'審查費用':money(r.amount),'證照類別':r.category,'證照名稱':r.certName,'獎勵金額':money(r.amount),'備註':r.note}[c]??'')}
function summaryBox(){const rows=state.records.filter(ownVisible);return `<div class="card"><div class="section-title"><h2>目前可查詢資料</h2><div class="actions"><button class="btn secondary" onclick="exportCSV()">匯出 CSV</button><button class="btn secondary" onclick="clearMine()">清除本人可刪資料</button></div></div>${summaryTable(rows)}</div>`}
function summaryTable(rows){if(!rows.length)return '<div class="empty">目前尚無可查詢資料。</div>';const agg={};rows.forEach(r=>{const t=teacherById(r.applicantId);const k=`${t?.['單位']||''}|${r.item}`;if(!agg[k])agg[k]={unit:t?.['單位']||'',item:r.item,cases:0,amount:0};agg[k].cases++;agg[k].amount+=Number(r.amount||0)});return `<div class="table-wrap"><table><thead><tr><th>單位</th><th>項目名稱</th><th>申請案次</th><th>申請經費小計</th></tr></thead><tbody>${Object.values(agg).map(x=>`<tr><td>${esc(x.unit)}</td><td>${esc(itemLabel(x.item))}</td><td class="num">${x.cases}</td><td class="num">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function clearMine(){if(!fillGuard())return;if(!confirm('確定刪除目前使用者可刪除的資料？'))return;state.records=state.records.filter(r=>r.fillerId!==currentUser['編號']);save();render()}
function staffView(){const unit=currentUser['單位'];const unitTeachers=TEACHERS.filter(t=>teacherClass(t)!=='承辦人員'&&t['單位']===unit);return `<div class="card item-card"><div class="item-head"><h2>單位承辦人｜教師代填</h2><div class="muted">請先選擇要代填的同單位教師，再按「開始代填」，即可進入與教師相同的六項申請表。</div></div><div class="notice"><b>承辦人代填方式：</b>承辦人不需要另外設定代填權限；登入後直接選擇本單位教師即可。之後所有新增資料都會記錄「填表人＝目前承辦人、申請人＝所選教師」。</div><div class="grid" style="margin-top:14px"><div class="field"><label>選擇代填教師</label><select id="staffApplicant">${unitTeachers.map(t=>`<option value="${esc(t['編號'])}">${esc(t['姓  名'])}｜${esc(t['教師職稱']||'')}｜${esc(t['編號'])}</option>`).join('')}</select></div><div class="field"><label>單位</label><div class="display-box">${esc(unit)}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="startStaffFill()">開始代填</button><button class="btn secondary" onclick="exportCSV()">匯出本單位 CSV</button></div></div><div class="card"><div class="section-title"><div><h2>本單位目前資料</h2><div class="muted">可查詢本單位教師的申請資料。</div></div></div>${summaryTable(state.records.filter(ownVisible))}</div><div class="card"><h2>教師代填權限設定</h2><div class="permission-note"><b>這項功能的用途：</b>由單位承辦人事先設定「哪位教師可以代哪位同單位教師填表」。設定後，該填表教師登入時，就能在「申請人」欄位選擇被授權代填的教師。<br><b>注意：</b>承辦人自己不需要設定權限，因為承辦人本身即可代填本單位所有教師；也不能設定跨單位代填。</div><div class="grid" style="margin-top:12px"><div class="field"><label>填表教師</label><select id="filler">${unitTeachers.map(t=>`<option value="${esc(t['編號'])}">${esc(t['姓  名'])}｜${esc(t['編號'])}</option>`).join('')}</select></div><div class="field"><label>可代填之同單位教師</label><select id="delegate">${unitTeachers.map(t=>`<option value="${esc(t['編號'])}">${esc(t['姓  名'])}｜${esc(t['編號'])}</option>`).join('')}</select></div></div><button class="btn primary" style="margin-top:12px" onclick="setDelegate()">新增代填權限</button><div style="margin-top:18px"><h3 style="margin-bottom:8px">目前已設定的代填權限</h3>${delegationTable(unitTeachers)}</div></div>`}
function delegationTable(unitTeachers){const unitIds=new Set(unitTeachers.map(t=>t['編號']));const pairs=[];Object.entries(state.delegations||{}).forEach(([f,arr])=>{if(!unitIds.has(f))return;(arr||[]).forEach(d=>{if(unitIds.has(d)){const ft=teacherById(f),dt=teacherById(d);if(ft&&dt)pairs.push({f,d,fn:ft['姓  名'],dn:dt['姓  名']})}})});if(!pairs.length)return '<div class="empty">目前尚未設定任何代填權限。</div>';return `<div class="table-wrap"><table style="min-width:650px"><thead><tr><th>填表教師</th><th>可代填教師</th><th style="width:110px">操作</th></tr></thead><tbody>${pairs.map(x=>`<tr><td>${esc(x.fn)}</td><td>${esc(x.dn)}</td><td><button class="btn danger small" onclick="removeDelegate('${esc(x.f)}','${esc(x.d)}')">取消權限</button></td></tr>`).join('')}</tbody></table></div>`}
function setDelegate(){const f=filler.value,d=delegate.value;const ft=teacherById(f),dt=teacherById(d);if(f===d)return alert('自己本身不需另設代填權限。');if(!ft||!dt||ft['單位']!==currentUser['單位']||dt['單位']!==currentUser['單位'])return alert('代填權限僅能設定同一單位教師。');state.delegations[f]=Array.from(new Set([...(state.delegations[f]||[]),d]));save();alert(`已設定「${ft['姓  名']}」可代填「${dt['姓  名']}」的資料。`);render()}
function removeDelegate(f,d){const ft=teacherById(f),dt=teacherById(d);if(!ft||!dt)return;if(!confirm(`確定取消「${ft['姓  名']}」代填「${dt['姓  名']}」的權限嗎？`))return;state.delegations[f]=(state.delegations[f]||[]).filter(id=>id!==d);if(!state.delegations[f].length)delete state.delegations[f];save();render()}
function exportCSV(){const rows=state.records.filter(ownVisible);if(!rows.length)return alert('目前沒有可匯出的資料。');const data=[['填表人','申請人','單位','項目','申請案次/類別','金額','備註'],...rows.map(r=>{const f=teacherById(r.fillerId),a=teacherById(r.applicantId);return [f?.['姓  名']||'',a?.['姓  名']||'',a?.['單位']||'',r.item,r.caseName||r.category||r.degree||r.place||'',r.amount||0,r.note||'']})];const csv='\ufeff'+data.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`獎補助調查資料_${state.year}.csv`;a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
